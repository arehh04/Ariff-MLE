[project]
name = "company-recommendation-system"
version = "0.0.0"
description = "Turn a company event feed into a similar-companies service with RabbitMQ and pgvector."
requires-python = ">=3.14,<3.15"
dependencies = [
  "aio-pika",
  "fastapi>=0.165.0",
  "fastembed>=0.9.1",
  "pgvector>=0.5.1",
  "psycopg[binary,pool]>=3.3.9",
  "pydantic-settings>=2.16.3",
  "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
extend-exclude = ["producer"]

[tool.ruff.lint]
ignore = ["E501"]
